spring.application.name=edms-backend
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/edms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=edms_user
spring.datasource.password=edms_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.level.com.edms=DEBUG
logging.level.org.hibernate.SQL=DEBUG


